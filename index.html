<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/preset.css"> <!-- Your Tailwind-based preset -->
  <link rel="stylesheet" href="/global.css"> <!-- Your Tailwind-based preset -->
  <link rel="stylesheet" href="/index.css"> <!-- Your Tailwind-based preset -->

  <!-- JavaScript Components -->
  <script type="module" src="/components/Section.js"></script>
  <script type="module" src="/components/Grid.js"></script>
</head>
<body>
  <main>
    <section-component id="whatisincluded">
        <h1>What’s Included With Your Subscription</h1>
        <p>
            Both our monthly and annual subscriptions offer small businesses a complete,
            hands-off web solution featuring custom design, unlimited revisions, proactive
            maintenance, secure hosting, and SEO optimization.
        </p>
      <grid-component id="grid-whatisincluded"></grid-component>
      <a href="/main.html">Contact us</a>
    </section-component>
  </main>

  <!-- Example JavaScript to pass data -->
  <script type="module">
    import { features } from './database.js'; // the data file with your features array

    window.addEventListener('DOMContentLoaded', () => {
      // Select the grid component by id
      const gridComponent = document.getElementById('grid-whatisincluded');

      // Pass the features array to the component via the setter.
      gridComponent.data = features;
    });
  </script>
</body>
</html>
