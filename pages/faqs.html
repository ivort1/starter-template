<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Frequently Asked Questions</title>

  <!-- Above-the-fold CSS: Tab toggle rules -->
  <style>
    /* Hide all FAQ groups */
    .faq-group {
      display: none;
      margin-top: 1rem;
    }

    /* Show the active group */
    #tab-websites:checked  ~ .faq-group.websites  { display: block; }
    #tab-pricing:checked   ~ .faq-group.pricing   { display: block; }
    #tab-subs:checked      ~ .faq-group.subs      { display: block; }

    /* Visually hide the radios */
    input[name="faq-tab"] {
      position: absolute;
      clip: rect(0,0,0,0);
      clip-path: inset(50%);
      width: 1px;
      height: 1px;
      overflow: hidden;
      white-space: nowrap;
    }

    /* Tab labels */
    .segment label span {
      display: inline-block;
      padding: 0.5rem 2rem;
      margin-right: 0.5rem;
      border: 1px solid var(--color-black);
      color: var(--color-black);
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Highlight the selected tab */
    #tab-websites:checked  ~ .segment label[for="tab-websites"] span,
    #tab-pricing:checked   ~ .segment label[for="tab-pricing"] span,
    #tab-subs:checked      ~ .segment label[for="tab-subs"] span {
      background-color: var(--color-black);
      color: var(--color-white);
    }
  </style>

  <!-- Global CSS -->
  <link rel="stylesheet" href="/css/fonts.css"/>
  <link rel="stylesheet" href="/css/preset.css"/>
  <link rel="stylesheet" href="/css/global.css"/>
  <link rel="stylesheet" href="/sections/navigationBar/navigationBar-2/NavigationBar-2.css"/>
  <link rel="stylesheet" href="/components/button/Button.css"/>
  <link rel="stylesheet" href="/components/segment/Segment.css"/>
  <link rel="stylesheet" href="/components/faq/Faq.css"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <!-- NAV BAR -->
  <nav class="manrope">
    <div class="global--section">
      <div class="nav__content">
        <a class="nav__title" href="/">Golden Bear Digital</a>
        <button class="nav__toggle-menu" aria-expanded="false" aria-label="Toggle menu">
          <div id="nav__bar-1"></div>
          <div id="nav__bar-2"></div>
          <div id="nav__bar-3"></div>
        </button>
      </div>
      <div class="nav__links">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/pages/services.html">Services</a></li>
          <li><a href="/pages/use-cases.html">Our Work</a></li>
          <li><a href="/#pricing">Pricing</a></li>
          <li><a href="/pages/faqs.html">FAQs</a></li>
          <li>
            <a class="button button__primary" href="/pages/contact-us.html">
              <span>
                Contact Us
                <svg fill="currentColor" width="1.5rem" height="1.5rem" viewBox="0 0 24 25" xmlns="http://www.w3.org/2000/svg" id="fi_9199645">
                  <path clip-rule="evenodd" d="m12.293 4.29535c.1875-.18747.4418-.29279.707-.29279s.5195.10532.707.29279l7 7.00005c.1875.1875.2928.4418.2928.7069 0 .2652-.1053.5195-.2928.707l-7 7.0001c-.1886.1821-.4412.2829-.7034.2806s-.513-.1074-.6984-.2928-.2906-.4363-.2929-.6984c-.0023-.2622.0985-.5148.2807-.7035l5.293-5.293h-13.586c-.26522 0-.51957-.1053-.70711-.2928-.18753-.1876-.29289-.4419-.29289-.7072 0-.2652.10536-.5195.29289-.7071.18754-.1875.44189-.2929.70711-.2929h13.586l-5.293-5.29295c-.1875-.18753-.2928-.44184-.2928-.707s.1053-.51947.2928-.707z" fill="currentColor" fill-rule="evenodd"/>
                </svg>
              </span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <!-- SECTION: FAQs -->
    <section id="faqs" class="global--section manrope">
      <h1 class="global--section-header">Frequently Asked Questions</h1>
      <h2 class="global--section-subheader spectral-semibold-italic">Have a Question?</h2>
      <p class="global--section-paragraph">
        Find quick answers to common questions about our custom website design, SEO services, logo creation, and small business web solutions.
      </p>

      <!-- 1) Tab radios -->
      <input type="radio" name="faq-tab" id="tab-websites" checked>
      <input type="radio" name="faq-tab" id="tab-pricing">
      <input type="radio" name="faq-tab" id="tab-subs">

      <!-- 2) Tab labels -->
      <div class="segment manrope">
        <label for="tab-websites"><span>Websites</span></label>
        <label for="tab-pricing"><span>Pricing & Payments</span></label>
        <label for="tab-subs"><span>Subscriptions</span></label>
      </div>

      <!-- 3) Empty FAQ containers -->
      <div class="faq-group websites"></div>
      <div class="faq-group pricing"></div>
      <div class="faq-group subs"></div>
    </section>
  </main>

  <script type="module" defer src="/sections/navigationBar/NavigationBar.js"></script>
  <script type="module">
    import { faqs } from "/database.js";

    const mapping = {
      websiteFaqs:             document.querySelector(".faq-group.websites"),
      pricingAndPaymentsFaqs:  document.querySelector(".faq-group.pricing"),
      subscriptionsFaqs:       document.querySelector(".faq-group.subs")
    };

    Object.entries(faqs).forEach(([key, list]) => {
      const container = mapping[key];
      list.forEach(({ question, answer }, i) => {
        const details = document.createElement("details");
        details.classList.add("faq", "manrope");
        const id = `${key}-faq-${i}`;
        details.innerHTML = `
          <summary aria-controls="${id}" aria-expanded="false">
            ${question}
            <svg aria-hidden="true" class="faq__svg" fill="currentColor" id="fi_9312231" enable-background="new 0 0 512 512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
              <g><g><path d="m256 439.98c-13.81 0-25-11.19-25-25v-317.96c0-13.81 11.19-25 25-25s25 11.19 25 25v317.96c0 13.81-11.19 25-25 25z"/></g>
              <g><path d="m414.98 281h-317.96c-13.81 0-25-11.19-25-25s11.19-25 25-25h317.96c13.81 0 25 11.19 25 25s-11.19 25-25 25z"/></g></g>
            </svg>
          </summary>
          <p id="${id}">${answer}</p>
        `;
        container.appendChild(details);
      });
    });

    document.querySelectorAll('.faq').forEach(faq => {
      const summary = faq.querySelector('summary');
      faq.addEventListener('toggle', () => {
        summary.setAttribute('aria-expanded', faq.open);
      });
    });
  </script>
</body>
</html>
